<a [routerLink]="['/services', service().slug]" class="service-card">
  <img [src]="service().image" [alt]="service().title" class="service-card__image" loading="lazy" width="800" height="1000" />
  <span class="service-card__scrim" aria-hidden="true"></span>
  <span class="icon service-card__icon" aria-hidden="true">{{ service().icon }}</span>

  <div class="service-card__content">
    <h3 class="service-card__title">{{ service().title }}</h3>
    <p class="service-card__description">{{ service().shortDescription }}</p>
    <span class="service-card__link">
      Learn More
      <span class="icon icon--sm" aria-hidden="true">arrow_forward</span>
    </span>
  </div>
</a>
