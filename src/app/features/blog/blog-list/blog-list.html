<app-hero-section
  [image]="heroImage"
  title="News &amp; Insights"
  subtitle="Company news, project updates and engineering insights from our team."
  [breadcrumbs]="[{ label: 'News' }]"
/>

<section class="section">
  <div class="container">
    <div class="filters" role="group" aria-label="Filter articles by category">
      @for (option of categoryOptions; track option.value) {
        <button
          type="button"
          class="filter-pill"
          [class.is-active]="selectedCategory() === option.value"
          (click)="setCategory(option.value)"
          [attr.aria-pressed]="selectedCategory() === option.value"
        >
          {{ option.label }}
        </button>
      }
    </div>

    @if (loading()) {
      <app-loading-spinner label="Loading articles…" />
    } @else if (hasError()) {
      <app-error-state (retry)="load()" message="We couldn't load articles. Please try again." />
    } @else if (posts().length === 0) {
      <app-empty-state icon="article" title="No Articles Found" message="There are no articles in this category yet." />
    } @else {
      <div class="card-grid card-grid--3">
        @for (post of posts(); track post.id) {
          <app-blog-card [post]="post" appReveal />
        }
      </div>
    }
  </div>
</section>
