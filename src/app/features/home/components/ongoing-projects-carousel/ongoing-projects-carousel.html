<div class="carousel">
  <div class="carousel__track" #track>
    @for (project of projects(); track project.id) {
      <div class="carousel__item">
        <app-project-card [project]="project" [showProgress]="true" />
      </div>
    }
  </div>

  @if (projects().length > 1) {
    <div class="carousel__controls">
      <button type="button" class="carousel__arrow" (click)="scroll('prev')" aria-label="Scroll to previous projects">
        <span class="icon" aria-hidden="true">chevron_left</span>
      </button>
      <button type="button" class="carousel__arrow" (click)="scroll('next')" aria-label="Scroll to next projects">
        <span class="icon" aria-hidden="true">chevron_right</span>
      </button>
    </div>
  }
</div>
